<h1>Raliya</h1>
<p>Raliya 是一個只給擁有者本人使用的個人助理，不對外提供服務。</p>
<h2 id="privacy">隱私權政策</h2>
<p>Raliya 只會在擁有者本人授權後，讀取他自己的 Google 日曆，讓助理知道他的行程。讀到的資料只存在他自己家裡的裝置上，不分享、不出售、不用於廣告，也不提供給任何第三方。</p>
<p>Raliya 對 Google 使用者資料的使用遵守 Google API 服務使用者資料政策（含有限使用規定）。</p>
<p>撤銷授權：Google 帳戶 → 安全性 → 第三方應用程式和服務。</p>
